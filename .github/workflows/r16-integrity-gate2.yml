name: R16 Integrity Gate 2
"on":
  push:
    branches: [master]
    paths: [".github/workflows/r16-integrity-gate2.yml"]
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: r16-edge-first}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy
      - run: python -m py_compile r16_edge_lab/r16_sim_core.py r16_edge_lab/run_integrity_gate2.py
      - run: python r16_edge_lab/run_integrity_gate2.py
      - run: cat r16_edge_lab/integrity_gate2/summary.json
      - uses: actions/upload-artifact@v4
        with: {name: r16-integrity-gate2, path: r16_edge_lab/integrity_gate2/, retention-days: 90}
