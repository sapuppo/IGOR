name: R16.4C July Gate Diagnostic
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/r16-4c-july-gate-diagnostic.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r16-edge-first
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Download R15.2 raw candles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35829207633 --repo sapuppo/IGOR -n r15-2-history-2024-present -D r15_regime_lab/history
      - name: Run July gate diagnostic
        run: python r16_edge_lab/run_r16_4c_july_gate_diagnostic.py
      - name: Print summary
        run: cat r16_edge_lab/r16_4c_july_gate_diagnostic/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: r16-4c-july-gate-diagnostic
          path: r16_edge_lab/r16_4c_july_gate_diagnostic/
          retention-days: 30
