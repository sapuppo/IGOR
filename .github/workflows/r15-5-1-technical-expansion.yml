name: R15.5.1 Technical Intelligence Expansion
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/r15-5-1-technical-expansion.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15-market-regime-lab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow
      - name: Download R15.2 raw candle history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35829207633 --repo sapuppo/IGOR -n r15-2-history-2024-present -D r15_regime_lab/history
      - name: Build causal technical expansion
        run: python r15_regime_lab/run_r15_5_1_technical_expansion.py
      - name: Print summary
        run: cat r15_regime_lab/technical_expansion/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: r15-5-1-technical-expansion
          path: r15_regime_lab/technical_expansion/
          retention-days: 30
          compression-level: 6
