name: R16 Backtest Integrity Gate\n# trigger integrity audit after workflow registration
"on":
  push:
    branches: [master]
    paths: [".github/workflows/r16-integrity-gate.yml"]
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: r16-edge-first}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy
      - name: Compile audit
        run: python -m py_compile r16_edge_lab/run_integrity_gate.py r16_edge_lab/run_r16_24_3_causal_revalidation.py
      - name: Run mandatory integrity audit
        run: python r16_edge_lab/run_integrity_gate.py
      - name: Show audit
        if: always()
        run: cat r16_edge_lab/integrity_audit/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r16-integrity-audit
          path: r16_edge_lab/integrity_audit/
          retention-days: 90
