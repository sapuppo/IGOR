name: R15.8 Economic Trade Intelligence
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/r15-8-economic-intelligence.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15-market-regime-lab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow scikit-learn lightgbm
      - name: Download R15.6 event intelligence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35884646939 --repo sapuppo/IGOR -n r15-6-event-intelligence -D r15_regime_lab/model_r15_6
      - name: Download R15.2 raw candles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35829207633 --repo sapuppo/IGOR -n r15-2-history-2024-present -D r15_regime_lab/history
      - name: Train R15.8 economic intelligence
        run: python r15_regime_lab/run_r15_8_economic_intelligence.py
      - name: Print summary
        run: cat r15_regime_lab/model_r15_8/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: r15-8-economic-trade-intelligence
          path: r15_regime_lab/model_r15_8/
          retention-days: 30
          compression-level: 6
