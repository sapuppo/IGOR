name: R16.29 Frozen USD-M Rebuild
"on":
  push:
    branches: [master]
    paths: [".github/workflows/r16-29-frozen-usdm.yml"]
  workflow_dispatch: {}
permissions: {actions: read, contents: read}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IGOR_CODE_SHA: c42577ba57095e45ea5d6972bde7bc6e03f8e8d8
    steps:
      - uses: actions/checkout@v4
        with: {ref: c42577ba57095e45ea5d6972bde7bc6e03f8e8d8}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r r16_edge_lab/requirements-r16-29.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: r16-28-2-usdm-*
          path: shards
          merge-multiple: true
          run-id: 36209442162
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: r16-28-3-consolidated-audit
          path: frozen_manifest
          run-id: 36213756825
          github-token: ${{ github.token }}
      - name: Materialize original USD-M bytes and frozen manifest
        run: |
          python - <<'PY'
          import pathlib,shutil,hashlib,json
          dst=pathlib.Path("r16_edge_lab/usdm_history")
          for p in pathlib.Path("shards").rglob("*.csv.gz"):
              parts=p.parts
              i=next((i for i,x in enumerate(parts) if x in ("funding","klines")),None)
              if i is None: continue
              q=dst.joinpath(*parts[i:]);q.parent.mkdir(parents=True,exist_ok=True)
              if q.exists(): assert hashlib.sha256(q.read_bytes()).digest()==hashlib.sha256(p.read_bytes()).digest()
              else: shutil.copy2(p,q)
          hits=[p for p in pathlib.Path("frozen_manifest").rglob("manifest.json") if json.loads(p.read_text()).get("dataset_manifest_sha256")=="a50c67ce220cb55dfc4249c08fb484ad8a2f55fe6d4b19dab58423209bee4041"]
          assert len(hits)==1,hits
          shutil.copy2(hits[0],dst/"manifest.json")
          print("DATA_FILES",len(list(dst.rglob("*.csv.gz"))))
          PY
      - name: Compile and retain original ledger fixture
        run: |
          python -m py_compile r16_edge_lab/run_r16_29_frozen_usdm.py r16_edge_lab/r16_usdm_engine.py r16_edge_lab/run_integrity_gate3.py
          PYTHONPATH=r16_edge_lab python r16_edge_lab/test_integrity_core2.py
      - name: Seek official supplementary funding mark prices
        timeout-minutes: 15
        run: python -u r16_edge_lab/collect_r16_29_funding_marks.py
      - name: Native USD-M BASE STRESS and Integrity Gate 3
        run: PYTHONPATH=r16_edge_lab python -u r16_edge_lab/run_r16_29_frozen_usdm.py
      - name: Record classification without promoting blocked evidence
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path("r16_edge_lab/r16_29_frozen_usdm/summary.json")
          if p.exists():
              s=json.loads(p.read_text())
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
                  f.write("## R16.29.2 integrity result\n\nStatus: **"+s["status"]+"**\n\nGate 3: "+json.dumps(s["gate3"])+"\n\nUntouched OOS: **not validated**\n\n")
                  for b in s["blocking_reasons"]:f.write("- "+str(b)+"\n")
              print(s["status"],json.dumps(s["gate3"]))
          else: raise SystemExit("No completed audit summary; run is not validated")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r16-29-2-native-usdm-gate3
          path: r16_edge_lab/r16_29_frozen_usdm/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r16-29-2-funding-mark-evidence
          path: r16_edge_lab/r16_29_funding_marks/
          retention-days: 90
