name: R16.29 Audit Data Materialization
"on":
  push:
    branches: [master]
    paths: [".github/workflows/r16-29-audit-data.yml"]
  workflow_dispatch: {}
permissions: {actions: read, contents: read}
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: r16-28-2-usdm-*
          path: shards
          merge-multiple: true
          run-id: 36209442162
          repository: sapuppo/IGOR
          github-token: ${{ github.token }}
      - name: Preserve exact dataset bytes in bounded audit bundles
        run: |
          python - <<'PY'
          import pathlib,shutil,hashlib,json
          root=pathlib.Path("shards");used=set();part=0;size=0;rows=[]
          for p in sorted(root.rglob("*.csv.gz")):
              if "klines" in p.parts:i=p.parts.index("klines")
              elif "funding" in p.parts:i=p.parts.index("funding")
              else:continue
              rel=pathlib.Path(*p.parts[i:])
              assert str(rel) not in used,str(rel)
              used.add(str(rel))
              n=p.stat().st_size
              assert n<24*1024*1024
              if size+n>24*1024*1024:part+=1;size=0
              q=pathlib.Path("bundles")/f"{part:02}"/rel
              q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q);size+=n
              rows.append({"path":str(rel),"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bundle":part})
          assert len(rows)==152,len(rows)
          pathlib.Path("audit_manifest.json").write_text(json.dumps(rows,indent=2))
          print("unchanged dataset files",len(rows),"bundles",part+1)
          PY
      - uses: actions/upload-artifact@v4
        if: hashFiles('bundles/00/**') != ''
        with:
          name: r16-29-audit-data-00
          path: bundles/00/
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: hashFiles('bundles/01/**') != ''
        with:
          name: r16-29-audit-data-01
          path: bundles/01/
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: hashFiles('bundles/02/**') != ''
        with:
