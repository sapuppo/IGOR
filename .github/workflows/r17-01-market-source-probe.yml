name: R17.01 public market source probe

on:
  push:
    branches: [master]
    paths: [.github/workflows/r17-01-market-source-probe.yml]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public exchanges and official archive without keys
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          endpoints={
            'BYBIT_TIME': 'https://api.bybit.com/v5/market/time',
            'BYBIT_KLINE': 'https://api.bybit.com/v5/market/kline?category=linear&symbol=BTCUSDT&interval=240&limit=2',
            'BYBIT_FUNDING': 'https://api.bybit.com/v5/market/funding/history?category=linear&symbol=BTCUSDT&limit=1',
            'BYBIT_TICKER': 'https://api.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT',
            'OKX_TIME': 'https://www.okx.com/api/v5/public/time',
            'OKX_TICKER': 'https://www.okx.com/api/v5/market/ticker?instId=BTC-USDT-SWAP',
            'OKX_KLINE': 'https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=4H&limit=2',
            'OKX_FUNDING': 'https://www.okx.com/api/v5/public/funding-rate-history?instId=BTC-USDT-SWAP&limit=1',
            'OKX_INSTRUMENTS': 'https://www.okx.com/api/v5/public/instruments?instType=SWAP',
            'BINANCE_ARCHIVE': 'https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/4h/BTCUSDT-4h-2026-09-25.zip.CHECKSUM',
          }
          for label,url in endpoints.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'IGOR-R17-public-probe/1.0'})
              with urllib.request.urlopen(req,timeout=10) as response:
                raw=response.read(600)
                print(label, 'HTTP',response.status,'SAMPLE',raw.decode('utf-8','replace')[:200])
            except urllib.error.HTTPError as err:
              print(label,'HTTP',err.code,'ERROR',err.read(300).decode('utf-8','replace')[:150])
            except Exception as err:
              print(label,'ERROR',type(err).__name__,str(err)[:150])
          PY
