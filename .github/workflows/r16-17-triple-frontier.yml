name: R16.17 Triple Engine Frontier
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/r16-17-triple-frontier.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r16-edge-first
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Download frozen CORE trades
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35960805987 --repo sapuppo/IGOR -n r16-10-extended-history-results -D r16_edge_lab/input_r16_10
      - name: Download frozen REV1H trades
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35963085634 --repo sapuppo/IGOR -n r16-14-extreme-reversion -D r16_edge_lab/input_r16_14
      - name: Download frozen REV15M trades
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35963816098 --repo sapuppo/IGOR -n r16-16-intraday-15m -D r16_edge_lab/input_r16_16
      - name: Run R16.17
        run: python r16_edge_lab/run_r16_17_triple_frontier.py
      - name: Print summary
        run: cat r16_edge_lab/r16_17_triple_frontier/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: r16-17-triple-frontier
          path: r16_edge_lab/r16_17_triple_frontier/
          retention-days: 90
