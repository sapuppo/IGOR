name: R14.2 Range Reclaim
on:
  push:
    branches:
      - tmp-r14-range-breakout-20260922
    paths:
      - "r14_range_breakout/run_r14_2_range_reclaim.py"
      - ".github/workflows/r14-2-range-reclaim.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-r14-range-breakout-20260922

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<3" "pandas<3" "scikit-learn<2" pyarrow requests

      - name: Download validated MTF dataset
        run: |
          mkdir -p dataset_artifact
          gh run download 35751357225 -n r13-1-binance-spot-mtf-dataset -D dataset_artifact
          tar -xzf dataset_artifact/V10_R13_1_BINANCE_SPOT_MTF_DATASET.tar.gz
          mv V10_R13_1_BINANCE_SPOT_MTF_DATASET r13_1_dataset
          test -f r13_1_dataset/15m/BTCUSDT.parquet

      - name: Syntax check
        run: python -m py_compile r14_range_breakout/run_r14_2_range_reclaim.py

      - name: Run R14.2
        working-directory: r14_range_breakout
        env:
          R14_DATA_ROOT: ../r13_1_dataset
        run: set -o pipefail; python run_r14_2_range_reclaim.py | tee r14_2_console.log

      - name: Bundle results
        if: always()
        run: |
          mkdir -p r14_2_output
          cp r14_range_breakout/r14_2_console.log r14_2_output/ || true
          cp r14_range_breakout/r14_result.json r14_2_output/ || true
          cp r14_range_breakout/r14_report.md r14_2_output/ || true
          cp r14_range_breakout/r14_trades.csv r14_2_output/ || true
          cp r14_range_breakout/r14_trades_stress.csv r14_2_output/ || true
          cp r14_range_breakout/r14_equity.parquet r14_2_output/ || true
          cp r14_range_breakout/r14_equity_stress.parquet r14_2_output/ || true
          cp r14_range_breakout/run_r14_2_range_reclaim.py r14_2_output/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r14-2-range-reclaim-results
          path: r14_2_output/
          compression-level: 6
          if-no-files-found: warn
