name: R15.7.1 Economic Failure Audit
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/r15-7-1-failure-audit.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15-market-regime-lab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow
      - name: Download R15.7 backtest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35891545456 --repo sapuppo/IGOR -n r15-7-event-economic-backtest -D r15_regime_lab/backtest_r15_7
      - name: Download R15.2 raw candles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35829207633 --repo sapuppo/IGOR -n r15-2-history-2024-present -D r15_regime_lab/history
      - name: Run R15.7.1 failure audit
        run: python r15_regime_lab/run_r15_7_1_failure_audit.py
      - name: Print summary
        run: cat r15_regime_lab/audit_r15_7_1/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: r15-7-1-economic-failure-audit
          path: r15_regime_lab/audit_r15_7_1/
          retention-days: 30
          compression-level: 6
