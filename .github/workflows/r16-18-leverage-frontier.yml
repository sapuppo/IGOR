name: R16.18 Controlled Leverage Frontier
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/r16-18-leverage-frontier.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  leverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r16-edge-first
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Download CORE
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35960805987 --repo sapuppo/IGOR -n r16-10-extended-history-results -D r16_edge_lab/r16_18_inputs/core
      - name: Download REV1H
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35963085634 --repo sapuppo/IGOR -n r16-14-extreme-reversion -D r16_edge_lab/r16_18_inputs/rev1h
      - name: Download REV15M
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35963816098 --repo sapuppo/IGOR -n r16-16-intraday-15m -D r16_edge_lab/r16_18_inputs/rev15m
      - name: Run R16.18
        run: python r16_edge_lab/run_r16_18_leverage_frontier.py
      - name: Print summary
        run: cat r16_edge_lab/r16_18_leverage_frontier/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: r16-18-leverage-frontier
          path: r16_edge_lab/r16_18_leverage_frontier/
          retention-days: 90
