name: R12.2 Rank Gate Diagnostic
on:
  push:
    branches:
      - tmp-r12-2-backtest-20260922
    paths:
      - "r12_2_diag/**"
      - ".github/workflows/r12-2-diag.yml"
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-r12-2-backtest-20260922
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install "numpy<3" "pandas<3" "scikit-learn<2" requests
      - name: Run diagnostic
        working-directory: r12_2_diag
        run: python run_diag.py | tee r12_2_diag_console.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r12-2-rankgate-diagnostic
          path: |
            r12_2_diag/r12_2_rankgate_diagnostic.json
            r12_2_diag/r12_2_diag_console.log
          if-no-files-found: warn
