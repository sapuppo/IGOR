name: R16 Funding Mark Source Probe
on:
  push:
    paths:
      - .github/workflows/r16-funding-source-probe.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Compare settlement mark and historical mark price minute candles
        run: |
          cat > /tmp/igor_funding_mark_probe.py <<'PY'
          """Read only source equivalence probe; does not modify IGOR strategy or data."""
          import csv
          import hashlib
          import io
          import json
          import time
          import urllib.parse
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone
          from decimal import Decimal
          from zipfile import ZipFile
          
          SYMBOLS = ('BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'AAVEUSDT', 'DOGEUSDT')
          DAYS = ('2021-01-15', '2023-11-15', '2024-02-15')
          BASE = 'https://fapi.binance.com/fapi/v1/'
          
          def get(url):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'IGOR funding source probe/1.0'}), timeout=25) as f:
                          return f.read()
                  except Exception as exc:
                      if attempt == 2:
                          raise RuntimeError(url.split('?')[0] + ': ' + str(exc)) from exc
                      time.sleep(1 + attempt * 2)
          
          def api(endpoint, **kwargs):
              return json.loads(get(BASE + endpoint + '?' + urllib.parse.urlencode(kwargs)))
          
          results = []
          for day in DAYS:
              start = int(datetime.fromisoformat(day).replace(tzinfo=timezone.utc).timestamp() * 1000)
              for symbol in SYMBOLS:
                  funding = api('fundingRate', symbol=symbol, startTime=start, endTime=start + 86400000 - 1, limit=100)
                  for ev in funding:
                      ts = ev['fundingTime']; minute = ts // 60000 * 60000
                      bars = api('markPriceKlines', symbol=symbol, interval='1m', startTime=minute - 60000, endTime=minute + 60000, limit=4)
                      by_time = {bar[0]: bar for bar in bars}
                      row = {'day': day, 'symbol': symbol, 'funding_time': ts, 'funding_mark': ev.get('markPrice') or None,
                             'same_minute_open': None, 'previous_minute_close': None, 'same_minute_close': None}
                      if minute in by_time:
                          row['same_minute_open'] = by_time[minute][1]
                          row['same_minute_close'] = by_time[minute][4]
                      if minute - 60000 in by_time:
                          row['previous_minute_close'] = by_time[minute - 60000][4]
                      results.append(row)
              print('completed day',day,flush=True)
          
          for day in DAYS:
              subset = [x for x in results if x['day'] == day]
              print('DAY',day,'EVENTS',len(subset),'OFFICIAL_MARK_PRESENT',sum(x['funding_mark'] is not None for x in subset),'MINUTE_BARS_PRESENT',sum(x['same_minute_open'] is not None for x in subset))
              for key in ('same_minute_open', 'previous_minute_close', 'same_minute_close'):
                  both = [x for x in subset if x['funding_mark'] is not None and x[key] is not None]
                  exact = [x for x in both if Decimal(x['funding_mark']) == Decimal(x[key])]
                  rel = sorted(abs((Decimal(x[key]) / Decimal(x['funding_mark'])) - 1) for x in both)
                  print('CANDIDATE',key,'COVERAGE',len(both),'EXACT',len(exact),'MEDIAN_REL',str(rel[len(rel)//2]) if rel else 'N/A','MAX_REL',str(rel[-1]) if rel else 'N/A')
          
          archive = 'https://data.binance.vision/data/futures/um/daily/markPriceKlines/BTCUSDT/1m/BTCUSDT-1m-2021-01-15.zip'
          try:
              data = get(archive)
              check = get(archive+'.CHECKSUM').decode().strip()
              digest = hashlib.sha256(data).hexdigest()
              with ZipFile(io.BytesIO(data)) as z:
                  rows = list(csv.reader(io.TextIOWrapper(z.open(z.namelist()[0]))))
              print('ARCHIVE','UTC_DAY','2021-01-15','SIZE',len(data),'SHA256',digest,'CHECKSUM_MATCH',digest in check,'ROWS',len(rows),'FIRST_ROW',rows[0][:7],flush=True)
          except Exception as exc:
              print('ARCHIVE_ERROR',str(exc)[:280],flush=True)
          
          print('DETAILS',json.dumps(results[:8],separators=(',', ':')),flush=True)
          PY
          python3 /tmp/igor_funding_mark_probe.py
