name: R16 Funding Mark Source Probe
on:
  push:
    paths:
      - .github/workflows/r16-funding-source-probe.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Compare checksummed public archive and frozen funding record
        run: |
          cat > /tmp/igor_funding_archive_probe.py <<'PY'
          """Compare archived minute mark candles to frozen independent funding API records."""
          import csv
          import hashlib
          import io
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone
          from decimal import Decimal
          from zipfile import ZipFile
          
          SAMPLES = {(s, d): v for s, d, v in [('BTCUSDT', '2021-01-15', [{'t': 1610668800002, 'mark': None}, {'t': 1610697600000, 'mark': None}, {'t': 1610726400004, 'mark': None}]), ('BTCUSDT', '2023-11-15', [{'t': 1700006400000, 'mark': '35560.60000000'}, {'t': 1700035200000, 'mark': '35596.70000000'}, {'t': 1700064000000, 'mark': '36415.64025773'}]), ('BTCUSDT', '2024-02-15', [{'t': 1707955200000, 'mark': '51816.90327305'}, {'t': 1707984000000, 'mark': '51802.40000000'}, {'t': 1708012800000, 'mark': '51961.58883688'}]), ('ETHUSDT', '2021-01-15', [{'t': 1610668800002, 'mark': None}, {'t': 1610697600000, 'mark': None}, {'t': 1610726400004, 'mark': None}]), ('ETHUSDT', '2023-11-15', [{'t': 1700006400000, 'mark': '1979.75289030'}, {'t': 1700035200000, 'mark': '1983.98000000'}, {'t': 1700064000000, 'mark': '2022.15000000'}]), ('ETHUSDT', '2024-02-15', [{'t': 1707955200000, 'mark': '2776.15000000'}, {'t': 1707984000000, 'mark': '2773.76693182'}, {'t': 1708012800000, 'mark': '2827.40701515'}]), ('SOLUSDT', '2021-01-15', [{'t': 1610668800002, 'mark': None}, {'t': 1610697600000, 'mark': None}, {'t': 1610726400004, 'mark': None}]), ('SOLUSDT', '2023-11-15', [{'t': 1700006400000, 'mark': '56.83822924'}, {'t': 1700035200000, 'mark': '59.18296065'}, {'t': 1700064000000, 'mark': '62.47600000'}]), ('SOLUSDT', '2024-02-15', [{'t': 1707955200000, 'mark': '117.09173686'}, {'t': 1707984000000, 'mark': '115.09659855'}, {'t': 1708012800000, 'mark': '114.08665167'}]), ('AAVEUSDT', '2021-01-15', [{'t': 1610668800002, 'mark': None}, {'t': 1610697600000, 'mark': None}, {'t': 1610726400004, 'mark': None}]), ('AAVEUSDT', '2023-11-15', [{'t': 1700006400000, 'mark': '90.77411446'}, {'t': 1700035200000, 'mark': '93.46469044'}, {'t': 1700064000000, 'mark': '94.67026641'}]), ('AAVEUSDT', '2024-02-15', [{'t': 1707955200000, 'mark': '91.10246359'}, {'t': 1707984000000, 'mark': '91.41000000'}, {'t': 1708012800000, 'mark': '92.19778808'}]), ('DOGEUSDT', '2021-01-15', [{'t': 1610668800002, 'mark': None}, {'t': 1610697600000, 'mark': None}, {'t': 1610726400004, 'mark': None}]), ('DOGEUSDT', '2023-11-15', [{'t': 1700006400000, 'mark': '0.07241858'}, {'t': 1700035200000, 'mark': '0.07359227'}, {'t': 1700064000000, 'mark': '0.07447024'}]), ('DOGEUSDT', '2024-02-15', [{'t': 1707955200000, 'mark': '0.08557000'}, {'t': 1707984000000, 'mark': '0.08557730'}, {'t': 1708012800000, 'mark': '0.08510000'}])]}
          ROOT = 'https://data.binance.vision/data/futures/um/daily/markPriceKlines/'
          
          def get(url):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as res:
                          return res.read()
                  except Exception as exc:
                      if attempt == 2:
                          raise RuntimeError(str(exc)) from exc
                      time.sleep(1+attempt)
          
          summary = {}
          details = []
          for (symbol, day), items in SAMPLES.items():
              url = ROOT + symbol + '/1m/' + symbol + '-1m-' + day + '.zip'
              try:
                  binary = get(url); checksum = get(url+'.CHECKSUM').decode()
                  digest = hashlib.sha256(binary).hexdigest()
                  if digest not in checksum:
                      raise ValueError('checksum mismatch')
                  with ZipFile(io.BytesIO(binary)) as z:
                      rows = list(csv.reader(io.TextIOWrapper(z.open(z.namelist()[0]))))
                  times = {int(r[0]):r for r in rows if r[0].isdigit()}
                  summary[symbol+'/'+day] = {'checksum_verified':True,'rows':len(times),'sha256':digest}
                  for ev in items:
                      minute = ev['t']//60000*60000
                      bar=times.get(minute); prev=times.get(minute-60000)
                      cand={'open':bar[1] if bar else None,'close':bar[4] if bar else None,'previous_close':prev[4] if prev else None}
                      det={'symbol':symbol,'day':day,'t':ev['t'],'settlement':ev['mark'],'candidate':cand}
                      if ev['mark'] and bar:
                          det['exact']={k:(Decimal(v)==Decimal(ev['mark']) if v else None) for k,v in cand.items()}
                          det['relative_diff']={k:(str(Decimal(v)/Decimal(ev['mark'])-1) if v else None) for k,v in cand.items()}
                      details.append(det)
              except Exception as exc:
                  summary[symbol+'/'+day]={'error':str(exc)[:140]}
                  print('ARCHIVE_ERROR',symbol,day,repr(exc)[:140],flush=True)
              else:
                  print('ARCHIVE_OK',symbol,day,'rows',len(times),'sample_events',len(items),flush=True)
          result={'archive':summary,'details':details}
          print('PROBE_RESULT_JSON',json.dumps(result,separators=(',',':')),flush=True)
          PY
          python3 /tmp/igor_funding_archive_probe.py
