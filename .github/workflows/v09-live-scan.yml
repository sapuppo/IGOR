name: V09 Live Scanner
on:
  push:
    branches: [chatgpt-v09-data-bridge-20260917]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 v09_bridge/live_scan.py | tee v09_live.log
      - uses: actions/upload-artifact@v4
        with:
          name: v09-live-scan
          path: |
            v09_live/
            v09_live.log
          retention-days: 1
