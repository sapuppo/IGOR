name: R15.2 Collect Historical Candles
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/r15-2-collect-history.yml"
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r15-market-regime-lab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Download and validate 39-symbol multi-timeframe history
        run: python r15_regime_lab/run_r15_2_collect_history.py --start 2024-01-01 --end 2026-09-23
      - uses: actions/upload-artifact@v4
        with:
          name: r15-2-history-2024-present
          path: r15_regime_lab/history/
          retention-days: 30
