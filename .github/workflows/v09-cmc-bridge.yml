name: V09 CMC Bridge
on:
  push:
    branches: [chatgpt-v09-data-bridge-20260917]
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect point-in-time CMC top 300
        run: python3 v09_bridge/collect_cmc.py
      - name: Upload CMC snapshots
        uses: actions/upload-artifact@v4
        with:
          name: v09-cmc-top300
          path: v09_out/
          retention-days: 1
