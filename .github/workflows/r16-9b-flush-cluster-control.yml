name: R16.9B Flush Cluster Control
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/r16-9b-flush-cluster-control.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r16-edge-first
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Download R15.2 raw candles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35829207633 --repo sapuppo/IGOR -n r15-2-history-2024-present -D r15_regime_lab/history
      - name: Run R16.9B cluster control
        run: python r16_edge_lab/run_r16_9b_flush_cluster_control.py
      - name: Print summary
        run: cat r16_edge_lab/r16_9b_flush_cluster_control/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: r16-9b-flush-cluster-control
          path: r16_edge_lab/r16_9b_flush_cluster_control/
          retention-days: 30
