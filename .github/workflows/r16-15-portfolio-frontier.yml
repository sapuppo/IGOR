name: R16.15 No-Leverage Portfolio Frontier
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/r16-15-portfolio-frontier.yml"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r16-edge-first
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Download 2021-2023 history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35960805987 --repo sapuppo/IGOR -n r16-10-pre2024-history -D r16_edge_lab/pre2024_history
      - name: Download 2024-present history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35829207633 --repo sapuppo/IGOR -n r15-2-history-2024-present -D r15_regime_lab/history
      - name: Run R16.15
        run: python r16_edge_lab/run_r16_15_portfolio_frontier.py
      - name: Print summary
        run: cat r16_edge_lab/r16_15_portfolio_frontier/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: r16-15-portfolio-frontier
          path: r16_edge_lab/r16_15_portfolio_frontier/
          retention-days: 90
# rerun after selected dictionary fix
